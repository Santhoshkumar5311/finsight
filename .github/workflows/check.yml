name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run setup:imports
      - run: npm run release:check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm ci --prefix apps/mobile
      - run: npm run typecheck --prefix apps/mobile
      - run: docker build -f services/api/Dockerfile -t finsight-api:check .
      - run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://api.example.test --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=build-only-placeholder -t finsight-web:check .
