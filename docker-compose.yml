# Local infrastructure only. These credentials are not production secrets.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: finsight
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finsight']
      interval: 5s
      retries: 10
  pii-analyzer:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:latest
    ports: ['127.0.0.1:5002:3000']
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: finsight
      RABBITMQ_DEFAULT_PASS: localdev
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
    volumes: ['rabbit-data:/var/lib/rabbitmq']
volumes:
  postgres-data:
  redis-data:
  rabbit-data:
